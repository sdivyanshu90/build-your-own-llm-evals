apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-eval-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: llm-eval-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/llm-eval-backend:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - eval_platform_api.main:app
            - --host=0.0.0.0
            - --port=8000
            - --workers=2
          envFrom:
            - configMapRef:
                name: llm-eval-config
            - secretRef:
                name: llm-eval-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-api
spec:
  selector:
    app.kubernetes.io/name: llm-eval-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-eval-api
