apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-eval
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "650"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [eval.example.invalid]
      secretName: llm-eval-tls
  rules:
    - host: eval.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: llm-eval-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: llm-eval-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-eval-web
                port:
                  name: http
