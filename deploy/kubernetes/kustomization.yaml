apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-eval
resources:
  - namespace.yaml
  - configmap.yaml
  - migration-job.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - web.yaml
  - ingress.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: llm-eval-platform
    includeSelectors: true
