apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-eval-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example/llm-eval-web:0.1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-web
spec:
  selector:
    app.kubernetes.io/name: llm-eval-web
  ports:
    - name: http
      port: 80
      targetPort: http
