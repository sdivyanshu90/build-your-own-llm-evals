apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-eval-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-eval-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-worker
