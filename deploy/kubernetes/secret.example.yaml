apiVersion: v1
kind: Secret
metadata:
  name: llm-eval-secrets
  namespace: llm-eval
type: Opaque
stringData:
  EVAL_DATABASE_URL: replace-with-secret-manager-reference
  EVAL_REDIS_URL: replace-with-secret-manager-reference
  EVAL_CELERY_BROKER_URL: replace-with-secret-manager-reference
  EVAL_S3_ENDPOINT_URL: replace-with-private-object-store-endpoint
  EVAL_S3_ACCESS_KEY_ID: replace-with-workload-identity-or-access-key
  EVAL_S3_SECRET_ACCESS_KEY: replace-with-workload-identity-or-secret-key
  EVAL_API_KEY_PEPPER: replace-with-at-least-32-random-bytes
