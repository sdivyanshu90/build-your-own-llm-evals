apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-eval-worker
    spec:
      serviceAccountName: llm-eval-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/llm-eval-backend:0.1.0
          args:
            - celery
            - -A
            - eval_platform_worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --queues=generation,metrics,maintenance
            - --concurrency=4
            - --max-tasks-per-child=100
          envFrom:
            - configMapRef:
                name: llm-eval-config
            - secretRef:
                name: llm-eval-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-eval-worker
