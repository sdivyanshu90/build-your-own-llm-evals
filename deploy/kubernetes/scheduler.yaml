apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-eval-scheduler
    spec:
      serviceAccountName: llm-eval-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: ghcr.io/example/llm-eval-backend:0.1.0
          args:
            - celery
            - -A
            - eval_platform_worker.celery_app:celery_app
            - beat
            - --loglevel=INFO
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: llm-eval-config
            - secretRef:
                name: llm-eval-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
