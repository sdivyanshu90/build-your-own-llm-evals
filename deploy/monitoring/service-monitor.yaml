apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-eval-api
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [llm-eval]
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-eval-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
